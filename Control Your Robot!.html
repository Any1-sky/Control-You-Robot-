<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control Your Robot!</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#402828;--deep:#320b0b;--key:#d9d9d9;--mute:#6e5656;--red:#ef5555;--green:#7ee787;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:Poppins,system-ui,sans-serif;overflow-x:hidden}
#rain{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.drop{position:absolute;top:-60px;opacity:.28;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
.title{position:absolute;top:0;left:24px;z-index:2;background:var(--key);border:clamp(5px,.6vw,9px) solid var(--deep);border-top:0;border-radius:0 0 clamp(24px,3vw,40px) clamp(24px,3vw,40px);padding:clamp(12px,2vh,22px) clamp(22px,3vw,44px) clamp(10px,1.6vh,18px);animation:drop .8s cubic-bezier(.3,1.6,.5,1) both}
.title h1{margin:0;font-size:clamp(30px,min(9vw,7vh),68px);line-height:.95;font-weight:800;color:var(--deep)}
.title h1 span{color:#000;display:block}
@keyframes drop{from{transform:translateY(-120%)}}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
main{position:relative;z-index:1;min-height:100vh;padding:24px 64px 90px 20px}
.top{margin-top:calc(clamp(30px,min(9vw,7vh),68px)*2 + 70px)}
/* login */
#login{display:flex;justify-content:center}
.card{width:min(420px,100%);background:var(--key);color:var(--deep);border:6px solid var(--deep);border-radius:32px;padding:30px;box-shadow:0 10px 0 var(--deep);animation:pop .6s both}
.card h2{margin:0 0 4px;font-size:34px;font-weight:800}
.card p{margin:0 0 20px;font-weight:600;opacity:.7}
.card label{display:block;font-weight:800;margin:12px 0 6px}
.card input{width:100%;height:50px;border:4px solid var(--deep);border-radius:16px;background:#fff;padding:0 16px;font:600 16px Poppins,system-ui,sans-serif;color:var(--deep);outline:none}
.card input:focus{box-shadow:0 0 0 4px #6e565655}
.err{color:#b3202a;font-weight:800;min-height:24px;margin-top:10px}
.card.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.btn{width:100%;margin-top:14px;height:56px;background:var(--deep);color:#fff;border:0;border-radius:18px;font:800 18px Poppins,system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 0 #000;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #000}
/* dashboard */
#dash{display:flex;flex-wrap:wrap;gap:clamp(24px,4vw,56px);align-items:flex-start}
.pad{--s:clamp(84px,min(28vw,20vh),190px);display:grid;grid-template-columns:repeat(3,var(--s));grid-template-rows:repeat(3,var(--s));gap:clamp(10px,1.4vw,20px);animation:pop .7s .2s both}
.k{background:var(--key);border:5px solid var(--deep);border-radius:24px;display:grid;place-items:center;cursor:pointer;padding:0;color:var(--deep);font:800 clamp(15px,2.2vw,26px) Poppins,system-ui,sans-serif;transition:transform .12s,box-shadow .12s,background .12s;box-shadow:0 8px 0 var(--deep);-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
.k:hover{background:#fff}
.k:active,.k.on{transform:translateY(7px);box-shadow:0 1px 0 var(--deep)}
.k svg{width:46%;height:46%;fill:var(--deep)}
.up{grid-area:1/2}.left{grid-area:2/1}.mid{grid-area:2/2}.right{grid-area:2/3}.down{grid-area:3/2}
.mid svg{width:56%;height:56%}
.mid.spin svg{animation:spin var(--spin,.6s) linear infinite}
.acts{margin-left:auto;display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.4vw,20px);width:min(100%,clamp(300px,34vw,520px));animation:pop .7s .4s both}
.acts .k{height:clamp(84px,min(18vw,15vh),150px)}
.acts .stop{grid-column:1/-1;background:var(--red);color:#fff}
.acts .stop:hover{background:#ff7373}
.hint{grid-column:1/-1;font-size:13px;font-weight:600;opacity:.7;line-height:1.5}
@media (max-width:900px){.acts{margin-left:0}main{padding-right:20px}}
.out{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:16px;z-index:3;background:var(--deep);color:#ff9a9a;border:3px solid var(--deep);border-radius:14px;padding:8px 16px;font:800 14px Poppins,system-ui,sans-serif;cursor:pointer}
.out:hover{background:var(--red);color:#fff}
.chip{position:fixed;left:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:2;background:var(--deep);border:3px solid var(--deep);border-radius:999px;padding:8px 18px;font-size:13px;font-weight:600;max-width:calc(100vw - 40px);cursor:pointer}
.chip.ok{border-color:var(--green)}
.chip.ok::before{content:'\25CF ';color:var(--green);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
/* drawer */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(88vw,420px);background:var(--deep);border-radius:36px 0 0 36px;border:4px solid #fff;border-right:0;z-index:5;padding:34px 34px 0 44px;padding-top:calc(34px + env(safe-area-inset-top,0px));transform:translateX(100%);transition:transform .5s cubic-bezier(.3,1.2,.5,1)}
.drawer.open{transform:none}
.tab{position:absolute;left:-46px;top:38%;width:46px;height:120px;background:var(--deep);border:4px solid #fff;border-right:0;border-radius:30px 0 0 30px;cursor:pointer;color:#fff;font-size:22px;padding:0}
.tab span{display:inline-block;transition:transform .4s}
.drawer.open .tab span{transform:rotate(180deg)}
.tab{animation:nudge 1.8s ease-in-out infinite}
.drawer.open .tab{animation:none}
@keyframes nudge{50%{transform:translateX(-8px)}}
.drawer h2{margin:0 0 6px;font-size:34px;font-weight:800}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;border-radius:9px;background:#fff;outline:none;margin:10px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:40px;height:40px;border-radius:50%;background:var(--mute);border:4px solid #fff;cursor:grab}
input[type=range]::-moz-range-thumb{width:32px;height:32px;border-radius:50%;background:var(--mute);border:4px solid #fff;cursor:grab}
.val{font-size:14px;opacity:.7;font-weight:600}
.conn{width:100%;margin-top:10px;background:#fff;color:var(--deep);border:4px solid #fff;border-radius:999px;padding:14px 20px;font:800 17px Poppins,system-ui,sans-serif;cursor:pointer;transition:transform .15s}
.conn:hover{transform:scale(1.04)}
.conn.live{background:transparent;color:#fff}
</style>
</head>
<body>
<div id="rain"></div>
<div class="title"><h1><span>Control</span>Your Robot!</h1></div>
<main>
  <section id="login" class="top" hidden>
    <form class="card" id="form" autocomplete="on">
      <h2>Login</h2><p>Masuk dulu untuk kontrol robot</p>
      <label for="u">Username</label><input id="u" placeholder="Masukkan username" required autocomplete="username">
      <label for="p">Password</label><input id="p" type="password" placeholder="Masukkan password" required autocomplete="current-password">
      <div class="err" id="err"></div>
      <button class="btn" type="submit">Login</button>
    </form>
  </section>

  <section id="dash" class="top" hidden>
    <button class="out" id="out">Logout</button>
    <div class="pad" role="group" aria-label="D-pad">
      <button class="k up" data-c="F" aria-label="Maju"><svg viewBox="0 0 24 24"><path d="M12 3 2 13l0 7 10-10 10 10 0-7z"/></svg></button>
      <button class="k left" data-c="L" aria-label="Kiri"><svg viewBox="0 0 24 24"><path d="M3 12 13 2l7 0L10 12l10 10-7 0z"/></svg></button>
      <button class="k mid" id="mid" aria-label="Putar logo"><svg viewBox="0 0 24 24"><path d="M2 12 20 2l-1 20z"/></svg></button>
      <button class="k right" data-c="R" aria-label="Kanan"><svg viewBox="0 0 24 24"><path d="M21 12 11 2 4 2l10 10L4 22l7 0z"/></svg></button>
      <button class="k down" data-c="B" aria-label="Mundur"><svg viewBox="0 0 24 24"><path d="M12 21 2 11l0-7 10 10L22 4l0 7z"/></svg></button>
    </div>
    <div class="acts">
      <button class="k stop" data-c="S">STOP</button>
      <button class="k" data-c="G">✊ Grip</button>
      <button class="k" data-c="O">🖐️ Release</button>
      <div class="hint">Keyboard: W A S D / panah = gerak, Spasi atau X = stop, G = grip, O atau R = release. Geser tab di kanan untuk Speed dan koneksi.</div>
    </div>

    <div class="chip" id="chip">Robot belum terhubung</div>
    <aside class="drawer" id="drawer">
      <button class="tab" id="tab" aria-label="Pengaturan"><span>‹</span></button>
      <h2>Speed!</h2>
      <input type="range" id="speed" min="1" max="10" value="3"><div class="val" id="sv"></div>
      <h2 style="margin-top:34px">Acceleration?</h2>
      <input type="range" id="acc" min="1" max="10" value="7"><div class="val" id="av"></div>
      <h2 style="margin-top:34px">Robot</h2>
      <button class="conn" id="conn">Hubungkan Bluetooth</button>
      <button class="conn" id="usb">Hubungkan via USB</button>
    </aside>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
// emoji rain
const em=['🤖','⚙️','🔧','⚡','🔩','🦾','🛰️','✨'],rain=$('rain');
function drop(){const e=document.createElement('div');e.className='drop';e.textContent=em[Math.random()*em.length|0];
e.style.left=Math.random()*100+'vw';e.style.fontSize=(18+Math.random()*30)+'px';
const d=5+Math.random()*7;e.style.animationDuration=d+'s';rain.appendChild(e);setTimeout(()=>e.remove(),d*1000)}
setInterval(drop,350);for(let i=0;i<10;i++)setTimeout(drop,i*120);
// login
let inn=false;try{inn=sessionStorage.getItem('isLoggedIn')==='true'}catch(e){}
function view(){$('login').hidden=inn;$('dash').hidden=!inn}
view();
$('form').onsubmit=e=>{e.preventDefault();
if($('u').value==='admin'&&$('p').value==='12345'){inn=true;try{sessionStorage.setItem('isLoggedIn','true')}catch(_){}$('err').textContent='';view()}
else{$('err').textContent='Username atau password salah!';const c=$('form');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}};
$('out').onclick=()=>{inn=false;try{sessionStorage.removeItem('isLoggedIn')}catch(e){}if(dev&&dev.gatt.connected)dev.gatt.disconnect();view()};
// settings
const speed=$('speed'),acc=$('acc'),chip=$('chip'),btn=$('conn'),mid=$('mid');
function upd(){$('sv').textContent='Level '+speed.value;$('av').textContent='Level '+acc.value}
speed.oninput=()=>{upd();send('speed:'+speed.value)};acc.oninput=()=>{upd();send('acc:'+acc.value)};upd();
const dr=$('drawer');$('tab').onclick=chip.onclick=()=>dr.classList.toggle('open');
// connection (Bluetooth BLE UART + USB serial)
const NUS='6e400001-b5a3-f393-a0a9-e50e24dcca9e',NUS_W='6e400002-b5a3-f393-a0a9-e50e24dcca9e',HM='0000ffe0-0000-1000-8000-00805f9b34fb',HM_C='0000ffe1-0000-1000-8000-00805f9b34fb';
let dev=null,chr=null,q=Promise.resolve(),wr=null,port=null;
function setChip(t,ok){chip.textContent=t;chip.classList.toggle('ok',!!ok)}
function send(s){const d=new TextEncoder().encode(s+'\n');
if(wr){wr.write(d).catch(()=>{});return}
if(!chr)return;
q=q.then(()=>chr.properties.writeWithoutResponse?chr.writeValueWithoutResponse(d):chr.writeValue(d)).catch(()=>{})}
function errMsg(e){const m=(e&&e.message)||String(e);
if(/policy|SecurityError|disallowed/i.test(m+(e&&e.name)))return 'Diblokir viewer. Buka link di tab baru Chrome/Edge.';
if(e&&e.name==='NotFoundError')return 'Tidak ada perangkat dipilih / tidak ketemu.';
if(/service|characteristic/i.test(m))return 'Service UART tidak ditemukan di perangkat.';
return 'Gagal: '+m}
btn.onclick=async()=>{
if(dev&&dev.gatt.connected){dev.gatt.disconnect();return}
if(!navigator.bluetooth){setChip('Browser tidak mendukung Bluetooth. Pakai Chrome/Edge.');return}
try{setChip('Mencari perangkat...');
dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[NUS,HM]});
dev.addEventListener('gattserverdisconnected',()=>{chr=null;btn.textContent='Hubungkan Bluetooth';btn.classList.remove('live');setChip('Bluetooth terputus')});
const srv=await dev.gatt.connect();
try{const s=await srv.getPrimaryService(NUS);chr=await s.getCharacteristic(NUS_W)}
catch(_){const s=await srv.getPrimaryService(HM);chr=await s.getCharacteristic(HM_C)}
btn.textContent='Putuskan Bluetooth';btn.classList.add('live');setChip('Terhubung: '+(dev.name||'Robot'),true);
send('speed:'+speed.value);send('acc:'+acc.value)
}catch(e){setChip(errMsg(e))}};
$('usb').onclick=async()=>{const u=$('usb');
if(wr){try{wr.releaseLock();await port.close()}catch(e){}wr=null;u.textContent='Hubungkan via USB';u.classList.remove('live');setChip('USB terputus');return}
if(!navigator.serial){setChip('Browser tidak mendukung USB Serial. Pakai Chrome/Edge di laptop.');return}
try{port=await navigator.serial.requestPort();await port.open({baudRate:115200});
wr=port.writable.getWriter();u.textContent='Putuskan USB';u.classList.add('live');setChip('Terhubung via USB',true);
send('speed:'+speed.value);send('acc:'+acc.value)}catch(e){setChip(errMsg(e))}};
if(window.top!==window.self)setChip('Tip: kalau Connect gagal, buka link di tab baru');
// buttons
function press(b){b.classList.add('on');send(b.dataset.c)}
document.querySelectorAll('[data-c]').forEach(b=>{
b.addEventListener('pointerdown',e=>{e.preventDefault();press(b)});
['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>b.classList.remove('on')))});
let st;mid.addEventListener('click',()=>{mid.style.setProperty('--spin',(0.9-speed.value*0.07)+'s');mid.classList.add('spin');
clearTimeout(st);st=setTimeout(()=>mid.classList.remove('spin'),2200)});
// keyboard
const km={ArrowUp:'F',KeyW:'F',ArrowDown:'B',KeyS:'B',ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R',Space:'S',KeyX:'S',KeyG:'G',KeyO:'O',KeyR:'O'};
addEventListener('keydown',e=>{if(!inn||e.target.tagName==='INPUT'||e.repeat)return;const c=km[e.code];if(!c)return;e.preventDefault();
const b=document.querySelector('[data-c="'+c+'"]');if(b)press(b)});
addEventListener('keyup',e=>{const c=km[e.code];if(!c)return;const b=document.querySelector('[data-c="'+c+'"]');if(b)b.classList.remove('on')});
</script>
</body>
</html>
